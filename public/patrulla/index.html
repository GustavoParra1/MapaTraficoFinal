
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f2a5c">
<title>Patrulla GPS + Cámara</title>

<!-- Leaflet MAPA -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  :root {
    --bg:#eef2f8; --surface:#ffffff; --ink:#0f1b33; --muted:#5b6b86; --line:#d6deeb;
    --blue:#1d4ed8; --blue-press:#1e40af; --navy:#0f2a5c;
    --red:#dc2626; --red-ink:#b91c1c; --red-soft:#fee2e2;
    --bubble-in:#e6ebf5;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b1220; --surface:#131d33; --ink:#e8eefc; --muted:#9aa9c7; --line:#25344f;
      --blue:#2563eb; --blue-press:#1d4ed8; --navy:#0a1630;
      --red-ink:#fca5a5; --red-soft:#3a1519; --bubble-in:#1d2a45;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.4;
    padding-bottom:calc(20px + var(--safe-bottom));
  }

  /* Barra superior fija: identidad del móvil + estado siempre visibles */
  .topbar {
    position:sticky; top:0; z-index:2000;
    background:var(--navy); color:#fff;
    padding:calc(12px + var(--safe-top)) calc(16px + env(safe-area-inset-right,0px)) 12px calc(16px + env(safe-area-inset-left,0px));
  }
  .topbar-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .topbar h1 { margin:0; font-size:22px; font-weight:800; }
  #movilAsignado {
    background:rgba(255,255,255,.16); padding:4px 12px; border-radius:999px;
    font-weight:700; font-size:15px; white-space:nowrap;
  }
  #movilAsignado:empty { display:none; }
  #estado { margin-top:6px; font-size:15px; color:rgba(255,255,255,.9); }

  .app {
    max-width:560px; margin:0 auto; padding:14px;
    display:flex; flex-direction:column; gap:14px;
  }

  /* Mapa */
  .map-wrap { position:relative; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:var(--surface); }
  #map { position:relative; height:clamp(170px,28vh,260px); transition:height .3s ease; background:var(--bubble-in); }
  #map.expanded { height:clamp(300px,58vh,520px); }
  #map:empty::before {
    content:"El mapa aparece al activar el GPS";
    position:absolute; inset:0; display:grid; place-items:center;
    padding:16px; text-align:center; color:var(--muted); font-size:15px;
  }
  #toggleMapBtn {
    position:absolute; left:10px; bottom:10px; z-index:1000;
    width:auto; min-height:44px; padding:0 14px; border-radius:12px;
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  #zoom-controls { position:absolute; top:10px; right:10px; z-index:1000; display:flex; flex-direction:column; gap:8px; }
  .zoom-btn {
    width:48px; height:48px; padding:0; border:1px solid var(--line); border-radius:12px;
    background:var(--surface); color:var(--ink); font-family:inherit; font-size:26px; font-weight:700;
    display:grid; place-items:center; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.25);
  }

  /* Cámara */
  #cameraViewerContainer {
    position:relative; width:100%; height:clamp(220px,40vh,460px);
    background:#000; border-radius:16px; overflow:hidden;
  }
  #localVideo { width:100%; height:100%; object-fit:contain; display:block; }

  /* Botones */
  .btn {
    -webkit-appearance:none; appearance:none;
    width:100%; min-height:60px; padding:0 16px; border:0; border-radius:14px;
    background:var(--blue); color:#fff;
    font-family:inherit; font-size:18px; font-weight:700; line-height:1.2; text-align:center;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .08s ease, background .15s ease;
  }
  .btn:active:not(:disabled) { transform:scale(.98); background:var(--blue-press); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .controls .wide { grid-column:1 / -1; }

  #emergenciaBtn {
    min-height:72px; font-size:20px;
    background:var(--red-soft); color:var(--red-ink);
    box-shadow:inset 0 0 0 2px var(--red);
  }
  #emergenciaBtn:active:not(:disabled) { background:var(--red-soft); }
  #emergenciaBtn.emergency {
    background:var(--red) !important; color:#fff;
    animation:pulso 1.2s ease-in-out infinite;
  }
  @keyframes pulso {
    0%,100% { box-shadow:0 0 0 0 rgba(220,38,38,.55); }
    50%     { box-shadow:0 0 0 10px rgba(220,38,38,0); }
  }
  #detenerBtn { background:transparent; color:var(--red-ink); box-shadow:inset 0 0 0 2px var(--line); }
  #detenerBtn:active:not(:disabled) { background:var(--red-soft); }

  .debug { border:1px dashed var(--line); border-radius:14px; padding:2px 12px; color:var(--muted); }
  .debug summary { min-height:48px; display:flex; align-items:center; cursor:pointer; font-size:15px; }
  .debug .btn {
    margin:2px 0 12px; min-height:52px; font-size:16px;
    background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line);
  }

  /* Chat */
  .chat { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .chat h2 { margin:0 0 10px; font-size:18px; }
  #chatBox {
    height:clamp(160px,26vh,300px); overflow:auto; overscroll-behavior:contain;
    display:flex; flex-direction:column; gap:8px; padding:2px;
  }
  #chatBox:empty::before { content:"Todavía no hay mensajes."; margin:auto; color:var(--muted); font-size:15px; }
  .msg {
    max-width:85%; padding:10px 14px; border-radius:16px 16px 16px 4px;
    background:var(--bubble-in); font-size:16px; line-height:1.35; overflow-wrap:anywhere;
  }
  .msg.mine { align-self:flex-end; background:var(--blue); color:#fff; border-radius:16px 16px 4px 16px; }
  .msg .from { display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:2px; }
  .chat-form { display:flex; gap:10px; margin-top:12px; }
  #chatInput {
    flex:1; min-width:0; min-height:56px; padding:0 16px; border-radius:14px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
    font-family:inherit; font-size:17px;
  }
  #chatInput:disabled { opacity:.5; }
  #enviarChatBtn { width:auto; min-width:96px; padding:0 20px; }

  button:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid #60a5fa; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) {
    #emergenciaBtn.emergency { animation:none; }
    .btn, #map { transition:none; }
  }
</style>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<body>

<header class="topbar">
  <div class="topbar-row">
    <h1>🚓 Patrulla</h1>
    <div id="movilAsignado"></div>
  </div>
  <div id="estado">🔐 Verificando sesión...</div>
</header>

<main class="app">

  <section class="map-wrap">
    <div id="map"></div>
    <button id="toggleMapBtn" type="button">📍 Ampliar / reducir mapa</button>
  </section>

  <div id="cameraViewerContainer" style="display:none;">
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <section class="controls">
    <button id="gpsBtn" class="btn" type="button">📡 Activar GPS</button>
    <button id="camaraBtn" class="btn" type="button" disabled>🎥 Activar cámara</button>
    <button id="emergenciaBtn" class="btn wide" type="button" disabled>🚨 Emergencia</button>
    <button id="detenerBtn" class="btn wide" type="button" disabled>⛔ Detener</button>
  </section>

  <details class="debug">
    <summary>Herramientas de prueba</summary>
    <button id="testVideoBtn" class="btn" type="button">🧪 Test video (debug)</button>
  </details>

  <section class="chat">
    <h2>💬 Chat</h2>
    <div id="chatBox"></div>
    <div class="chat-form">
      <input id="chatInput" placeholder="Escribí un mensaje" enterkeyhint="send" autocomplete="off" disabled>
      <button id="enviarChatBtn" class="btn" type="button" disabled>Enviar</button>
    </div>
  </section>

</main>

<script>
// ============================
// 🔥 FIREBASE
// ============================
firebase.initializeApp({
  apiKey: "AIzaSyBp2ZiKA4lYieyjX_aJJjE023NeqKrRhJc",
  authDomain: "seguridad-mdp-v2.firebaseapp.com",
  databaseURL: "https://seguridad-mdp-v2-default-rtdb.firebaseio.com",
  projectId: "seguridad-mdp-v2"
});

const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();

// ============================
// VARIABLES
// ============================
let idPatrulla = null;
let watchId = null;
let emergenciaActiva = false;
let localStream = null;
let isCapturingFrames = false;
let frameIntervalId = null;
let pc = null;
let gpsActivo = false;
let map = null;
let marker = null;

// ============================
// 🎯 SELECCIONAR ELEMENTOS DEL DOM
// ============================
const gpsBtn = document.getElementById('gpsBtn');
const camaraBtn = document.getElementById('camaraBtn');
const detenerBtn = document.getElementById('detenerBtn');
const emergenciaBtn = document.getElementById('emergenciaBtn');
const chatBox = document.getElementById('chatBox');
const chatInput = document.getElementById('chatInput');
const enviarChatBtn = document.getElementById('enviarChatBtn');
const movilAsignado = document.getElementById('movilAsignado');
const localVideo = document.getElementById('localVideo');
const toggleMapBtn = document.getElementById('toggleMapBtn');
const mapElement = document.getElementById('map');

// Toggle mapa expandido/contraído
toggleMapBtn.addEventListener('click', () => {
  mapElement.classList.toggle('expanded');
  if (window.map) {
    setTimeout(() => window.map.invalidateSize(), 350);
  }
});

console.log("🧩 [PATRULLA] DOM Elements loaded:", {
  gpsBtn: !!gpsBtn,
  camaraBtn: !!camaraBtn,
  detenerBtn: !!detenerBtn,
  emergenciaBtn: !!emergenciaBtn,
  chatBox: !!chatBox,
  chatInput: !!chatInput,
  enviarChatBtn: !!enviarChatBtn,
  localVideo: !!localVideo
});

// ============================
// HELPER: ESTADO
// ============================
function estado(mensaje) {
  const estadoDiv = document.getElementById('estado');
  if (estadoDiv) {
    estadoDiv.innerHTML = mensaje;
  }
}

// ============================
// SESIÓN
// ============================
auth.onAuthStateChanged(async user => {
  if (!user) return location.href = "/login.html";

  // 🚀 FAST TRACK: Deducir rol del email (sin depender de RTDB)
  const autoRol = user.email.includes("patrulla") ? "patrulla" : "com";
  
  if (autoRol !== "patrulla") {
    alert("Acceso no autorizado - Solo patrullas pueden acceder");
    return auth.signOut();
  }

  // 🔍 BUSCAR patrullaId en RTDB por email del usuario actual
  let patrullaIdBuscado = null;
  try {
    // Primero buscar en "patrullas" (nueva estructura)
    const patrullasSnap = await db.ref("patrullas").once("value");
    const patrullas = patrullasSnap.val() || {};
    
    for (const patente in patrullas) {
      if (patrullas[patente].email === user.email) {
        patrullaIdBuscado = patente;
        console.log("✅ Patrulla encontrada en patrullas/:", patrullaIdBuscado);
        break;
      }
    }
    
    // Si no encontró, buscar en "usuarios" (estructura vieja)
    if (!patrullaIdBuscado) {
      const usuariosSnap = await db.ref("usuarios").once("value");
      const usuarios = usuariosSnap.val() || {};
      
      for (const uid in usuarios) {
        if (usuarios[uid].email === user.email && usuarios[uid].patrullaId) {
          patrullaIdBuscado = usuarios[uid].patrullaId;
          console.log("✅ Patrulla encontrada en usuarios/:", patrullaIdBuscado);
          break;
        }
      }
    }
  } catch (err) {
    console.warn("⚠️ No se pudo buscar patrulla en RTDB:", err.message);
  }

  // 🆔 ID DE LA PATRULLA (del RTDB si existe, sino generar)
  idPatrulla = patrullaIdBuscado || "AA120JS"; // Fallback a AA120JS si no encuentra

  // Mostrar en UI
  movilAsignado.innerText = "Móvil: " + idPatrulla;

  // 🚓 REGISTRAR / CREAR PATRULLA AL INICIAR SESIÓN (CLAVE)
  await db.ref("patrullas/" + idPatrulla).update({
    online: true,
    estado: "conectado",
    camara: false,
    emergencia: false,
    hasNewMessage: false,
    timestamp: Date.now()
  }).catch(err => console.warn("⚠️ No se pudo registrar patrulla en RTDB:", err.message));

  console.log("🚓 Patrulla registrada en Firebase:", idPatrulla);

  // 🧹 Limpiar WebRTC si se corta conexión
  db.ref(`webrtc/${idPatrulla}`).onDisconnect().remove().catch(() => {});

  // 🔓 Habilitar controles
  gpsBtn.disabled = false;
  detenerBtn.disabled = false;
  emergenciaBtn.disabled = false;
  enviarChatBtn.disabled = false;
  chatInput.disabled = false;

  // 💬 Chat
  iniciarChat();

  // Estado UI
  estado("✅ Sesión iniciada. Activá el GPS.");
});

// ============================
// MAPA
// ============================
function iniciarMapa(lat, lng) {
  if (!map) {
    // Crear mapa sin controles de zoom (zoomControl: false)
    map = L.map("map", { zoomControl: false }).setView([lat, lng], 16);
    window.map = map; // Exponer para el toggle
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
    marker = L.marker([lat, lng]).addTo(map);
    
    // Crear contenedor de controles de zoom personalizados
    const mapContainer = document.getElementById("map");
    const zoomControls = document.createElement("div");
    zoomControls.id = "zoom-controls";
    zoomControls.innerHTML = `
      <button class="zoom-btn" id="zoom-in-btn" type="button">+</button>
      <button class="zoom-btn" id="zoom-out-btn" type="button">−</button>
    `;
    mapContainer.appendChild(zoomControls);
    
    // Eventos de zoom
    document.getElementById("zoom-in-btn").onclick = () => map.zoomIn();
    document.getElementById("zoom-out-btn").onclick = () => map.zoomOut();
  } else {
    marker.setLatLng([lat, lng]);
    map.setView([lat, lng]);
  }
}

// ============================
// GPS
// ============================
gpsBtn.onclick = () => {
  if (gpsActivo) {
    navigator.geolocation.clearWatch(watchId);
    gpsActivo = false;
    gpsBtn.innerText = "📡 Activar GPS";
    camaraBtn.disabled = true;
    estado("⏸️ GPS detenido");
    return;
  }

  watchId = navigator.geolocation.watchPosition(
    pos => {
      const { latitude, longitude } = pos.coords;

      iniciarMapa(latitude, longitude);

      db.ref("patrullas/" + idPatrulla).update({
        online: true,
        lat: latitude,
        lng: longitude,
        estado: emergenciaActiva ? "emergencia" : "activo",
        emergencia: emergenciaActiva,
        timestamp: Date.now()
      });
    },
    e => alert("Error GPS: " + e.message),
    { enableHighAccuracy: true }
  );

  gpsActivo = true;
  gpsBtn.innerText = "📡 GPS activo";
  camaraBtn.disabled = false;
  estado("📡 GPS transmitiendo");
};

// ============================
// CÁMARA + WEBRTC
// ============================
camaraBtn.onclick = async () => {
  try {
    console.log("[Cámara] 🎯 Solicitando acceso a cámara...");
    
    // ✅ Constraints SIMPLES y COMPATIBLES (funciona en cualquier dispositivo)
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });

    console.log("[Cámara] ✅ Stream obtenido - VideoTracks:", localStream.getVideoTracks().length, "AudioTracks:", localStream.getAudioTracks().length);

    localVideo.srcObject = localStream;
    console.log("[Cámara] 📹 Video asignado al elemento");

    await localVideo.play();
    console.log("[Cámara] ✅ Video reproduciéndose");
    
    // ✅ Validación SIMPLE (no invasiva - NO corta la cámara)
    localVideo.onloadedmetadata = () => {
      console.log(`[Cámara] ✅ Resolución: ${localVideo.videoWidth}x${localVideo.videoHeight}`);
    };

    localVideo.onplaying = () => {
      console.log("[Cámara] ✅ Video activo y transmitiendo");
    };

    // ✅ NO MATAR LA CÁMARA - Dejar que transmita aunque no decodifique
    // El WebRTC seguirá funcionando en background
    console.log("[Cámara] ✅ Cámara ACTIVA - transmitiendo a WebRTC");

    // Mostrar contenedor
    document.getElementById('cameraViewerContainer').style.display = 'block';
    console.log("[Cámara] 👁️ Contenedor visible");

    // Iniciar WebRTC
    await iniciarWebRTC();
    
    // ✅ Iniciar captura de frames MJPEG
    startFrameCapture();
    estado("🎥 Cámara activa");

  } catch (e) {
    console.error("[Cámara] ❌ Error:", e.message);
    alert("❌ Error cámara: " + e.message + "\n\nVerifica:\n1. Permiso de cámara en navegador\n2. Cámara conectada\n3. Recarga la página");
  }
};

async function iniciarWebRTC() {
  try {
    console.log("[WebRTC] 🎬 Iniciando WebRTC desde patrulla - idPatrulla:", idPatrulla);

    pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    // ✅ AGREGAR TRACKS (simple y directo)
    if (!localStream) {
      console.error("[WebRTC] ❌ No hay stream de cámara");
      alert("Error: No hay stream disponible");
      return;
    }

    localStream.getTracks().forEach(track => {
      console.log(`[WebRTC] ✅ Agregando track: ${track.kind} (${track.id})`);
      pc.addTrack(track, localStream);
    });

    // ✅ FORZAR H.264 CODEC (mejor compatibilidad en navegadores) - MÁXIMA PRIORIDAD
    if (RTCRtpSender.getCapabilities) {
      const caps = RTCRtpSender.getCapabilities('video');
      const h264Codecs = caps.codecs.filter(c => c.mimeType.includes('H264'));
      const vp8Codecs = caps.codecs.filter(c => c.mimeType === 'video/VP8');
      const vp9Codecs = caps.codecs.filter(c => c.mimeType === 'video/VP9');
      
      console.log(`[WebRTC Patrulla] H264: ${h264Codecs.length}, VP8: ${vp8Codecs.length}, VP9: ${vp9Codecs.length}`);
      
      if (vp9Codecs.length > 0) {
        // FORZAR VP9 - mejor soporte en navegadores
        pc.getTransceivers()
          .filter(t => t.sender && t.sender.track && t.sender.track.kind === 'video')
          .forEach(t => {
            t.setCodecPreferences(vp9Codecs);
            console.log(`[WebRTC Patrulla] 🔒 FORZANDO SOLO VP9: ${vp9Codecs.map(c => c.mimeType).join(', ')}`);
          });
      } else if (h264Codecs.length > 0) {
        console.log("[WebRTC Patrulla] ⚠️ VP9 no disponible, usando H264");
        pc.getTransceivers()
          .filter(t => t.sender && t.sender.track && t.sender.track.kind === 'video')
          .forEach(t => {
            t.setCodecPreferences(h264Codecs);
          });
      } else {
        console.log("[WebRTC Patrulla] ⚠️ VP9/H264 no disponibles, permitiendo negociación automática");
      }
    }

    // ✅ ICE CANDIDATES
    pc.onicecandidate = e => {
      if (e.candidate) {
        console.log("[WebRTC] 🧊 ICE candidate generado");
        db.ref(`webrtc/${idPatrulla}/ice_patru`).push(e.candidate);
      }
    };

    pc.onconnectionstatechange = () => {
      console.log("[WebRTC] 🔌 Connection state:", pc.connectionState);
    };

    // ✅ CREAR Y ENVIAR OFFER
    console.log("[WebRTC] 📤 Creando offer...");
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.ref(`webrtc/${idPatrulla}/offer`).set(offer);
    console.log("[WebRTC] ✅ Offer enviado a Firebase");

    // ✅ RECIBIR ANSWER
    db.ref(`webrtc/${idPatrulla}/answer`).on("value", async s => {
      if (s.val() && pc.signalingState === 'have-local-offer') {
        try {
          console.log("[WebRTC] 📥 Answer recibido");
          await pc.setRemoteDescription(new RTCSessionDescription(s.val()));
          console.log("[WebRTC] ✅ Remote description configurado");
        } catch (err) {
          console.error("[WebRTC] ❌ Error con answer:", err.message);
        }
      }
    });

    // ✅ ICE DESDE COM
    db.ref(`webrtc/${idPatrulla}/ice_com`).on("child_added", async s => {
      try {
        await pc.addIceCandidate(new RTCIceCandidate(s.val()));
        console.log("[WebRTC] ✅ ICE candidate agregado");
      } catch (err) {
        console.error("[WebRTC] ❌ Error ICE:", err.message);
      }
    });

  } catch (e) {
    console.error("[WebRTC] ❌ Error:", e.message);
    alert("Error WebRTC: " + e.message);
  }
}



// ============================
// CHAT
// ============================
function iniciarChat() {
  db.ref("chat/" + idPatrulla).on("child_added", s => {
    const m = s.val();
    const propio = m.from === idPatrulla;
    const burbuja = document.createElement('div');
    burbuja.className = 'msg' + (propio ? ' mine' : '');
    if (!propio) {
      const quien = document.createElement('span');
      quien.className = 'from';
      quien.textContent = m.from;
      burbuja.appendChild(quien);
    }
    burbuja.appendChild(document.createTextNode(m.text));
    chatBox.appendChild(burbuja);
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

document.getElementById('testVideoBtn').onclick = async () => {
  try {
    console.log("[TEST] 🧪 Iniciando test video con canvas...");
    
    // ✅ MÉTODO MEJORADO: Usar MediaStream con canvas manualmente
    const canvas = document.createElement('canvas');
    canvas.width = 640;
    canvas.height = 480;
    const ctx = canvas.getContext('2d');
    
    // Crear stream de audio/video vacío que llenaremos con datos
    let frameCount = 0;
    let isDrawing = true;
    
    // Función para dibujar frame
    const drawFrame = () => {
      frameCount++;
      const hue = (frameCount % 360);
      
      // Fondo principal
      ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Rectángulo que cambia de color
      ctx.fillStyle = `hsl(${(hue + 120) % 360}, 100%, 50%)`;
      ctx.fillRect(80, 150, 200, 180);
      
      // Texto con contador
      ctx.fillStyle = 'white';
      ctx.font = 'bold 60px Arial';
      ctx.shadowColor = 'rgba(0, 0, 0, 1)';
      ctx.shadowBlur = 10;
      ctx.fillText(`${frameCount}`, 250, 300);
      
      // Pequeño cuadrado parpadeante
      if (frameCount % 10 < 5) {
        ctx.fillStyle = 'black';
      } else {
        ctx.fillStyle = 'white';
      }
      ctx.fillRect(550, 420, 40, 40);
    };
    
    // ✅ CRÍTICO: Dibujar primer frame ANTES de capturar
    console.log("[TEST] Dibujando primer frame antes de capturar...");
    drawFrame();
    
    // ✅ Usar canvas.captureStream() pero con frames garantizados
    console.log("[TEST] Capturando stream del canvas...");
    const canvasStream = canvas.captureStream(30);
    
    if (!canvasStream || canvasStream.getTracks().length === 0) {
      throw new Error("Canvas stream vacío");
    }
    
    console.log("[TEST] ✅ Canvas stream capturado con", canvasStream.getTracks().length, "tracks");
    
    // Asignar al video local
    localStream = canvasStream;
    localVideo.srcObject = localStream;
    
    try {
      await localVideo.play();
      console.log("[TEST] ✅ Video local reproduciendo");
    } catch (e) {
      console.warn("[TEST] ⚠️ Play autoplay rechazado:", e.message);
    }
    
    // ✅ ASEGURAR FRAMES CONTINUOS: Dibujar en canvas continuamente
    // Esto es crítico para que captureStream() tenga datos
    let animFrameCounter = 0;
    const animLoop = () => {
      if (!isDrawing) return;
      
      drawFrame();
      animFrameCounter++;
      
      // Log cada 100 frames
      if (animFrameCounter % 100 === 0) {
        console.log(`[TEST] 🎨 Canvas animación en marcha - ${animFrameCounter} frames dibujados`);
      }
      
      // Continuar más rápido que requestAnimationFrame para garantir 30fps
      setTimeout(animLoop, 33);
    };
    
    animLoop();
    
    // Guardar referencias para poder detener
    window.testIsRunning = () => isDrawing;
    window.testStop = () => { isDrawing = false; };
    
    console.log("[TEST] 🎬 Canvas animación iniciada");
    console.log("[TEST] 📊 Stream tracks:", canvasStream.getTracks().map(t => ({ kind: t.kind, enabled: t.enabled, readyState: t.readyState, id: t.id })));
    
    // Iniciar WebRTC con este stream
    console.log("[TEST] Iniciando WebRTC con canvas stream...");
    await iniciarWebRTC();
    
    // ✅ INICIAR CAPTURA MJPEG TAMBIÉN
    console.log("[TEST] 🎥 Iniciando captura MJPEG...");
    startFrameCapture();
    
    estado("🧪 TEST VIDEO activo - colores animados transmitiendo");
    
  } catch (e) {
    console.error("[TEST] ❌ Error:", e.message);
    console.error("[TEST] Stack:", e.stack);
    alert("Error test video: " + e.message);
  }
};

// ============================
// 📹 CAPTURA MJPEG (FRAMES)
// ============================
function startFrameCapture() {
  if (isCapturingFrames) return;
  
  isCapturingFrames = true;
  console.log("[Captura MJPEG] ✅ Iniciando captura de frames...");
  
  let frameCount = 0;
  
  // Cada 50ms capturar un frame (20 fps)
  frameIntervalId = setInterval(async () => {
    if (!isCapturingFrames || !localStream) return;
    
    try {
      // Obtener dimensiones reales del video
      const videoWidth = localVideo.videoWidth || 640;
      const videoHeight = localVideo.videoHeight || 480;
      
      // Crear canvas manteniendo aspect ratio original
      // Escalar para que el lado más largo sea máximo 480px
      const maxSize = 480;
      let canvasWidth, canvasHeight;
      
      if (videoWidth > videoHeight) {
        // Video horizontal
        canvasWidth = maxSize;
        canvasHeight = Math.round(maxSize * (videoHeight / videoWidth));
      } else {
        // Video vertical
        canvasHeight = maxSize;
        canvasWidth = Math.round(maxSize * (videoWidth / videoHeight));
      }
      
      const canvas = document.createElement('canvas');
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      const ctx = canvas.getContext('2d');
      
      // Dibujar el frame actual del video manteniendo proporciones
      ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
      
      // Convertir a base64 directamente (sin pasar por blob)
      // Calidad 45% = balance entre calidad y velocidad
      const base64 = canvas.toDataURL('image/jpeg', 0.45);
      
      try {
        // Guardar en RTDB en lugar de Storage
        await db.ref(`frames/${idPatrulla}/latest`).set({
          data: base64,
          timestamp: Date.now()
        });
        
        frameCount++;
        if (frameCount % 20 === 0) {
          console.log(`[Captura MJPEG] Frame ${frameCount} enviado`);
        }
      } catch (err) {
        console.error("[Captura MJPEG] Error escribiendo a RTDB:", err.message);
      }
      
    } catch (err) {
      console.error("[Captura MJPEG] Error capturando frame:", err.message);
    }
  }, 50); // Cada 50ms = ~20 fps
}

function stopFrameCapture() {
  isCapturingFrames = false;
  if (frameIntervalId) {
    clearInterval(frameIntervalId);
    frameIntervalId = null;
  }
  console.log("[Captura MJPEG] ⛔ Captura detenida");
}


function forzarH264(pc) {
  if (
    typeof RTCRtpSender === "undefined" ||
    !RTCRtpSender.getCapabilities
  ) {
    console.warn("⚠️ No se puede forzar H264 en este navegador");
    return;
  }

  const caps = RTCRtpSender.getCapabilities("video");
  const h264 = caps.codecs.filter(c =>
    c.mimeType.toLowerCase() === "video/h264"
  );

  if (!h264.length) {
    console.warn("⚠️ H264 no disponible");
    return;
  }

  pc.getTransceivers().forEach(t => {
    if (t.sender && t.sender.track && t.sender.track.kind === "video") {
      t.setCodecPreferences(h264);
      console.log("🎥 H264 forzado en patrulla");
    }
  });
}
