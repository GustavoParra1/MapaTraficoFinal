
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrulla GPS + Cámara</title>

<!-- Leaflet MAPA -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
    .card h3 { font-size:2em; margin-top:24px; margin-bottom:10px; }
  body { font-family: Arial; padding:20px; background:#f3f4f6; }
  .card { background:white; padding:20px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
  .card h2 { font-size:2.6em; margin-bottom:10px; }
  #movilAsignado { font-size:2.2em; margin-bottom:16px; }
  button, input { width:100%; padding:18px 20px; margin-top:12px; border-radius:8px; border:1px solid #ccc; font-size:20px; font-family:inherit; min-height:56px; }
  #chatInput { font-size:28px; min-height:56px; padding:18px 20px; margin-top:12px; border-radius:8px; border:1px solid #ccc; }
  #enviarChatBtn { background:#1d4ed8; color:white; font-weight:bold; cursor:pointer; font-size:20px; min-height:56px; display:flex; align-items:center; justify-content:center; margin-top:12px; border-radius:8px; border:1px solid #ccc; }
  #enviarChatBtn:hover { background:#1e40af; }
  #enviarChatBtn:disabled { background:#9ca3af; cursor:not-allowed; }
  button { background:#1d4ed8; color:white; font-weight:bold; cursor:pointer; font-size:20px; min-height:56px; display:flex; align-items:center; justify-content:center; }
  button:hover { background:#1e40af; }
  button:disabled { background:#9ca3af; cursor:not-allowed; }
  #estado { margin-top:15px; padding:10px; border-radius:8px; background:#e5e7eb; }
  .emergency { background:#dc2626 !important; }
  .success { background:#10b981 !important; }
  #map { height:250px; margin-top:12px; border-radius:10px; }
  #cameraViewerContainer {
    position: relative;
    width: 100%;
    height: 250px;
    background: black;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  #localVideo { 
    width: 100%;
    height: 100%;
    object-fit: cover; /* Asegura que el video cubra el contenedor */
    margin-top: 0; /* Eliminar margin-top ya que el contenedor lo manejará */
  }
</style>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body>

<div class="card">
  <h2>🚓 Patrulla</h2>
  <div id="movilAsignado" style="font-weight:bold;color:#1d4ed8"></div>

  <button id="gpsBtn">📡 Activar GPS</button>
  <button id="camaraBtn" disabled>🎥 Activar cámara</button>
  <button id="testVideoBtn">🧪 TEST VIDEO (Debug)</button>
  <button id="detenerBtn" disabled style="background:#dc2626;">⛔ Detener</button>
  <button id="emergenciaBtn" disabled>🚨 Emergencia</button>

  <div id="map"></div>
  <div id="cameraViewerContainer" style="display:none;">
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <div id="estado">🔐 Verificando sesión...</div>

  <h3>💬 Chat</h3>
  <div id="chatBox" style="height:200px;overflow:auto;border:1px solid #ccc;padding:10px;font-size:28px"></div>
  <input id="chatInput" placeholder="Mensaje..." disabled>
  <button id="enviarChatBtn" disabled>Enviar</button>
</div>

<script>
// ============================
// 🔥 FIREBASE
// ============================
firebase.initializeApp({
  apiKey: "AIzaSyBp2ZiKA4lYieyjX_aJJjE023NeqKrRhJc",
  authDomain: "seguridad-mdp-v2.firebaseapp.com",
  databaseURL: "https://seguridad-mdp-v2-default-rtdb.firebaseio.com",
  projectId: "seguridad-mdp-v2"
});

const auth = firebase.auth();
const db = firebase.database();

// ============================
// VARIABLES
// ============================
let idPatrulla = null;
let watchId = null;
let emergenciaActiva = false;
let localStream = null;
let pc = null;
let gpsActivo = false;
let map = null;
let marker = null;

// ============================
// 🎯 SELECCIONAR ELEMENTOS DEL DOM
// ============================
const gpsBtn = document.getElementById('gpsBtn');
const camaraBtn = document.getElementById('camaraBtn');
const detenerBtn = document.getElementById('detenerBtn');
const emergenciaBtn = document.getElementById('emergenciaBtn');
const chatBox = document.getElementById('chatBox');
const chatInput = document.getElementById('chatInput');
const enviarChatBtn = document.getElementById('enviarChatBtn');
const movilAsignado = document.getElementById('movilAsignado');
const localVideo = document.getElementById('localVideo');

console.log("🧩 [PATRULLA] DOM Elements loaded:", {
  gpsBtn: !!gpsBtn,
  camaraBtn: !!camaraBtn,
  detenerBtn: !!detenerBtn,
  emergenciaBtn: !!emergenciaBtn,
  chatBox: !!chatBox,
  chatInput: !!chatInput,
  enviarChatBtn: !!enviarChatBtn,
  localVideo: !!localVideo
});

// ============================
// HELPER: ESTADO
// ============================
function estado(mensaje) {
  const estadoDiv = document.getElementById('estado');
  if (estadoDiv) {
    estadoDiv.innerHTML = mensaje;
  }
}

// ============================
// SESIÓN
// ============================
auth.onAuthStateChanged(async user => {
  if (!user) return location.href = "/login.html";

  // 🚀 FAST TRACK: Deducir rol del email (sin depender de RTDB)
  const autoRol = user.email.includes("patrulla") ? "patrulla" : "com";
  
  if (autoRol !== "patrulla") {
    alert("Acceso no autorizado - Solo patrullas pueden acceder");
    return auth.signOut();
  }

  // 🔍 BUSCAR patrullaId en RTDB por email del usuario actual
  let patrullaIdBuscado = null;
  try {
    const usuariosSnap = await db.ref("usuarios").once("value");
    const usuarios = usuariosSnap.val() || {};
    
    // Buscar el usuario que coincida con el email actual
    for (const uid in usuarios) {
      if (usuarios[uid].email === user.email && usuarios[uid].patrullaId) {
        patrullaIdBuscado = usuarios[uid].patrullaId;
        console.log("✅ Patrulla encontrada en RTDB:", patrullaIdBuscado);
        break;
      }
    }
  } catch (err) {
    console.warn("⚠️ No se pudo buscar patrulla en RTDB:", err.message);
  }

  // 🆔 ID DE LA PATRULLA (del RTDB si existe, sino generar)
  idPatrulla = patrullaIdBuscado || "AA120JS"; // Fallback a AA120JS si no encuentra

  // Mostrar en UI
  movilAsignado.innerText = "Móvil: " + idPatrulla;

  // 🚓 REGISTRAR / CREAR PATRULLA AL INICIAR SESIÓN (CLAVE)
  await db.ref("patrullas/" + idPatrulla).update({
    online: true,
    estado: "conectado",
    camara: false,
    emergencia: false,
    hasNewMessage: false,
    timestamp: Date.now()
  }).catch(err => console.warn("⚠️ No se pudo registrar patrulla en RTDB:", err.message));

  console.log("🚓 Patrulla registrada en Firebase:", idPatrulla);

  // 🧹 Limpiar WebRTC si se corta conexión
  db.ref(`webrtc/${idPatrulla}`).onDisconnect().remove().catch(() => {});

  // 🔓 Habilitar controles
  gpsBtn.disabled = false;
  detenerBtn.disabled = false;
  emergenciaBtn.disabled = false;
  enviarChatBtn.disabled = false;
  chatInput.disabled = false;

  // 💬 Chat
  iniciarChat();

  // Estado UI
  estado("✅ Sesión iniciada. Activá el GPS.");
});

// ============================
// MAPA
// ============================
function iniciarMapa(lat, lng) {
  if (!map) {
    // Crear mapa sin controles de zoom (zoomControl: false)
    map = L.map("map", { zoomControl: false }).setView([lat, lng], 16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
    marker = L.marker([lat, lng]).addTo(map);
    
    // Crear contenedor de controles de zoom personalizados
    const mapContainer = document.getElementById("map");
    const zoomControls = document.createElement("div");
    zoomControls.id = "zoom-controls";
    zoomControls.innerHTML = `
      <button class="zoom-btn" id="zoom-in-btn" type="button">+</button>
      <button class="zoom-btn" id="zoom-out-btn" type="button">−</button>
    `;
    mapContainer.appendChild(zoomControls);
    
    // Eventos de zoom
    document.getElementById("zoom-in-btn").onclick = () => map.zoomIn();
    document.getElementById("zoom-out-btn").onclick = () => map.zoomOut();
  } else {
    marker.setLatLng([lat, lng]);
    map.setView([lat, lng]);
  }
}

// ============================
// GPS
// ============================
gpsBtn.onclick = () => {
  if (gpsActivo) {
    navigator.geolocation.clearWatch(watchId);
    gpsActivo = false;
    gpsBtn.innerText = "📡 Activar GPS";
    camaraBtn.disabled = true;
    estado("⏸️ GPS detenido");
    return;
  }

  watchId = navigator.geolocation.watchPosition(
    pos => {
      const { latitude, longitude } = pos.coords;

      iniciarMapa(latitude, longitude);

      db.ref("patrullas/" + idPatrulla).update({
        online: true,
        lat: latitude,
        lng: longitude,
        estado: emergenciaActiva ? "emergencia" : "activo",
        emergencia: emergenciaActiva,
        timestamp: Date.now()
      });
    },
    e => alert("Error GPS: " + e.message),
    { enableHighAccuracy: true }
  );

  gpsActivo = true;
  gpsBtn.innerText = "📡 GPS activo";
  camaraBtn.disabled = false;
  estado("📡 GPS transmitiendo");
};

// ============================
// CÁMARA + WEBRTC
// ============================
camaraBtn.onclick = async () => {
  try {
    console.log("[Cámara] 🎯 Solicitando acceso a cámara...");
    
    // ✅ Constraints SIMPLES y COMPATIBLES (funciona en cualquier dispositivo)
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });

    console.log("[Cámara] ✅ Stream obtenido - VideoTracks:", localStream.getVideoTracks().length, "AudioTracks:", localStream.getAudioTracks().length);

    localVideo.srcObject = localStream;
    console.log("[Cámara] 📹 Video asignado al elemento");

    await localVideo.play();
    console.log("[Cámara] ✅ Video reproduciéndose");
    
    // ✅ Validación SIMPLE (no invasiva - NO corta la cámara)
    localVideo.onloadedmetadata = () => {
      console.log(`[Cámara] ✅ Resolución: ${localVideo.videoWidth}x${localVideo.videoHeight}`);
    };

    localVideo.onplaying = () => {
      console.log("[Cámara] ✅ Video activo y transmitiendo");
    };

    // ✅ NO MATAR LA CÁMARA - Dejar que transmita aunque no decodifique
    // El WebRTC seguirá funcionando en background
    console.log("[Cámara] ✅ Cámara ACTIVA - transmitiendo a WebRTC");

    // Mostrar contenedor
    document.getElementById('cameraViewerContainer').style.display = 'block';
    console.log("[Cámara] 👁️ Contenedor visible");

    // Iniciar WebRTC
    await iniciarWebRTC();
    estado("🎥 Cámara activa");

  } catch (e) {
    console.error("[Cámara] ❌ Error:", e.message);
    alert("❌ Error cámara: " + e.message + "\n\nVerifica:\n1. Permiso de cámara en navegador\n2. Cámara conectada\n3. Recarga la página");
  }
};

async function iniciarWebRTC() {
  try {
    console.log("[WebRTC] 🎬 Iniciando WebRTC desde patrulla - idPatrulla:", idPatrulla);

    pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    // ✅ AGREGAR TRACKS (simple y directo)
    if (!localStream) {
      console.error("[WebRTC] ❌ No hay stream de cámara");
      alert("Error: No hay stream disponible");
      return;
    }

    localStream.getTracks().forEach(track => {
      console.log(`[WebRTC] ✅ Agregando track: ${track.kind} (${track.id})`);
      pc.addTrack(track, localStream);
    });

    // ✅ FORZAR H.264 CODEC (mejor compatibilidad en navegadores)
    if (RTCRtpSender.getCapabilities) {
      const caps = RTCRtpSender.getCapabilities('video');
      const h264Codecs = caps.codecs.filter(c => c.mimeType.includes('H264'));
      if (h264Codecs.length > 0) {
        pc.getTransceivers()
          .filter(t => t.sender && t.sender.track && t.sender.track.kind === 'video')
          .forEach(t => {
            t.setCodecPreferences(h264Codecs);
            console.log("[WebRTC] ✅ H.264 codec forzado");
          });
      } else {
        console.log("[WebRTC] ⚠️ H.264 no disponible, using VP8");
      }
    }

    // ✅ ICE CANDIDATES
    pc.onicecandidate = e => {
      if (e.candidate) {
        console.log("[WebRTC] 🧊 ICE candidate generado");
        db.ref(`webrtc/${idPatrulla}/ice_patru`).push(e.candidate);
      }
    };

    pc.onconnectionstatechange = () => {
      console.log("[WebRTC] 🔌 Connection state:", pc.connectionState);
    };

    // ✅ CREAR Y ENVIAR OFFER
    console.log("[WebRTC] 📤 Creando offer...");
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.ref(`webrtc/${idPatrulla}/offer`).set(offer);
    console.log("[WebRTC] ✅ Offer enviado a Firebase");

    // ✅ RECIBIR ANSWER
    db.ref(`webrtc/${idPatrulla}/answer`).on("value", async s => {
      if (s.val() && pc.signalingState === 'have-local-offer') {
        try {
          console.log("[WebRTC] 📥 Answer recibido");
          await pc.setRemoteDescription(new RTCSessionDescription(s.val()));
          console.log("[WebRTC] ✅ Remote description configurado");
        } catch (err) {
          console.error("[WebRTC] ❌ Error con answer:", err.message);
        }
      }
    });

    // ✅ ICE DESDE COM
    db.ref(`webrtc/${idPatrulla}/ice_com`).on("child_added", async s => {
      try {
        await pc.addIceCandidate(new RTCIceCandidate(s.val()));
        console.log("[WebRTC] ✅ ICE candidate agregado");
      } catch (err) {
        console.error("[WebRTC] ❌ Error ICE:", err.message);
      }
    });

  } catch (e) {
    console.error("[WebRTC] ❌ Error:", e.message);
    alert("Error WebRTC: " + e.message);
  }
}



// ============================
// CHAT
// ============================
function iniciarChat() {
  db.ref("chat/" + idPatrulla).on("child_added", s => {
    const m = s.val();
    chatBox.innerHTML += `<div><b>${m.from}:</b> ${m.text}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

enviarChatBtn.onclick = () => {
  if (!chatInput.value) return;
  db.ref("chat/" + idPatrulla).push({
    from: idPatrulla,
    text: chatInput.value,
    timestamp: Date.now()
  });
  chatInput.value = "";
};

// ============================
// EMERGENCIA / DETENER
// ============================
emergenciaBtn.onclick = () => {
  emergenciaActiva = !emergenciaActiva;
  emergenciaBtn.classList.toggle("emergency", emergenciaActiva);
  
  db.ref("patrullas/" + idPatrulla).update({
    emergencia: emergenciaActiva,
    estado: emergenciaActiva ? "emergencia" : "activo",
    timestamp: Date.now()
  })
    .then(() => {
      console.log("🚨 [EMERGENCIA] Estado actualizado: emergencia=" + emergenciaActiva);
    })
    .catch(err => console.error("❌ [EMERGENCIA] Error:", err.message));
};

// ============================
// TEST VIDEO (PARA DEBUG - genera una onda con canvas)
// ============================
document.getElementById('testVideoBtn').onclick = async () => {
  try {
    console.log("[TEST] 🧪 Iniciando test video con canvas...");
    
    // ✅ MÉTODO MEJORADO: Usar MediaStream con canvas manualmente
    const canvas = document.createElement('canvas');
    canvas.width = 640;
    canvas.height = 480;
    const ctx = canvas.getContext('2d');
    
    // Crear stream de audio/video vacío que llenaremos con datos
    let frameCount = 0;
    let isDrawing = true;
    
    // Función para dibujar frame
    const drawFrame = () => {
      frameCount++;
      const hue = (frameCount % 360);
      
      // Fondo principal
      ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Rectángulo que cambia de color
      ctx.fillStyle = `hsl(${(hue + 120) % 360}, 100%, 50%)`;
      ctx.fillRect(80, 150, 200, 180);
      
      // Texto con contador
      ctx.fillStyle = 'white';
      ctx.font = 'bold 60px Arial';
      ctx.shadowColor = 'rgba(0, 0, 0, 1)';
      ctx.shadowBlur = 10;
      ctx.fillText(`${frameCount}`, 250, 300);
      
      // Pequeño cuadrado parpadeante
      if (frameCount % 10 < 5) {
        ctx.fillStyle = 'black';
      } else {
        ctx.fillStyle = 'white';
      }
      ctx.fillRect(550, 420, 40, 40);
    };
    
    // ✅ CRÍTICO: Dibujar primer frame ANTES de capturar
    console.log("[TEST] Dibujando primer frame antes de capturar...");
    drawFrame();
    
    // ✅ Usar canvas.captureStream() pero con frames garantizados
    console.log("[TEST] Capturando stream del canvas...");
    const canvasStream = canvas.captureStream(30);
    
    if (!canvasStream || canvasStream.getTracks().length === 0) {
      throw new Error("Canvas stream vacío");
    }
    
    console.log("[TEST] ✅ Canvas stream capturado con", canvasStream.getTracks().length, "tracks");
    
    // Asignar al video local
    localStream = canvasStream;
    localVideo.srcObject = localStream;
    
    try {
      await localVideo.play();
      console.log("[TEST] ✅ Video local reproduciendo");
    } catch (e) {
      console.warn("[TEST] ⚠️ Play autoplay rechazado:", e.message);
    }
    
    // ✅ ASEGURAR FRAMES CONTINUOS: Dibujar en canvas continuamente
    // Esto es crítico para que captureStream() tenga datos
    let animFrameCounter = 0;
    const animLoop = () => {
      if (!isDrawing) return;
      
      drawFrame();
      animFrameCounter++;
      
      // Log cada 100 frames
      if (animFrameCounter % 100 === 0) {
        console.log(`[TEST] 🎨 Canvas animación en marcha - ${animFrameCounter} frames dibujados`);
      }
      
      // Continuar más rápido que requestAnimationFrame para garantir 30fps
      setTimeout(animLoop, 33);
    };
    
    animLoop();
    
    // Guardar referencias para poder detener
    window.testIsRunning = () => isDrawing;
    window.testStop = () => { isDrawing = false; };
    
    console.log("[TEST] 🎬 Canvas animación iniciada");
    console.log("[TEST] 📊 Stream tracks:", canvasStream.getTracks().map(t => ({ kind: t.kind, enabled: t.enabled, readyState: t.readyState, id: t.id })));
    
    // Iniciar WebRTC con este stream
    console.log("[TEST] Iniciando WebRTC con canvas stream...");
    await iniciarWebRTC();
    estado("🧪 TEST VIDEO activo - colores animados transmitiendo");
    
  } catch (e) {
    console.error("[TEST] ❌ Error:", e.message);
    console.error("[TEST] Stack:", e.stack);
    alert("Error test video: " + e.message);
  }
};

console.log("🟢 [PATRULLA] Sistema inicializado ✅");

detenerBtn.onclick = () => {
  if (watchId) navigator.geolocation.clearWatch(watchId);
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) pc.close();
  
  // Limpiar test video si está activo
  if (window.testAnimId) {
    clearInterval(window.testAnimId);
    window.testAnimId = null;
  }

  // Ocultar contenedor de cámara
  document.getElementById('cameraViewerContainer').style.display = 'none';

  // Limpiar datos de WebRTC en Firebase al detener
  if (idPatrulla) {
    db.ref(`webrtc/${idPatrulla}`).remove();
  }

  estado("⛔ Sistema detenido");
};


function forzarH264(pc) {
  if (
    typeof RTCRtpSender === "undefined" ||
    !RTCRtpSender.getCapabilities
  ) {
    console.warn("⚠️ No se puede forzar H264 en este navegador");
    return;
  }

  const caps = RTCRtpSender.getCapabilities("video");
  const h264 = caps.codecs.filter(c =>
    c.mimeType.toLowerCase() === "video/h264"
  );

  if (!h264.length) {
    console.warn("⚠️ H264 no disponible");
    return;
  }

  pc.getTransceivers().forEach(t => {
    if (t.sender && t.sender.track && t.sender.track.kind === "video") {
      t.setCodecPreferences(h264);
      console.log("🎥 H264 forzado en patrulla");
    }
  });
}

</script>

</body>
</html>
