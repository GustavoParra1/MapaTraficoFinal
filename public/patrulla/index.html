
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet MAPA -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
    .card h3 { font-size:2em; margin-top:24px; margin-bottom:10px; }
  body { font-family: Arial; padding:20px; background:#f3f4f6; }
  .card { background:white; padding:20px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
  .card h2 { font-size:2.6em; margin-bottom:10px; }

  #chatInput { font-size:28px; min-height:56px; padding:18px 20px; margin-top:12px; border-radius:8px; border:1px solid #ccc; }
  #enviarChatBtn { background:#1d4ed8; color:white; font-weight:bold; cursor:pointer; font-size:20px; min-height:56px; display:flex; align-items:center; justify-content:center; margin-top:12px; border-radius:8px; border:1px solid #ccc; }
  #enviarChatBtn:hover { background:#1e40af; }
  #enviarChatBtn:disabled { background:#9ca3af; cursor:not-allowed; }
  button { background:#1d4ed8; color:white; font-weight:bold; cursor:pointer; font-size:20px; min-height:56px; display:flex; align-items:center; justify-content:center; }

    position: relative;
    width: 100%;
    height: 250px;

    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  #localVideo { 
    width: 100%;
    height: 100%;
    object-fit: cover; /* Asegura que el video cubra el contenedor */
    margin-top: 0; /* Eliminar margin-top ya que el contenedor lo manejará */
  }
</style>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<body>

<div class="card">
  <h2>🚓 Patrulla</h2>
  <div id="movilAsignado" style="font-weight:bold;color:#1d4ed8"></div>

  <button id="gpsBtn">📡 Activar GPS</button>
  <button id="camaraBtn" disabled>🎥 Activar cámara</button>
  <button id="testVideoBtn">🧪 TEST VIDEO (Debug)</button>
  <button id="detenerBtn" disabled style="background:#dc2626;">⛔ Detener</button>
  <button id="emergenciaBtn" disabled>🚨 Emergencia</button>

  <div id="map"></div>
  <div id="cameraViewerContainer" style="display:none;">
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <div id="estado">🔐 Verificando sesión...</div>

  <h3>💬 Chat</h3>
  <div id="chatBox" style="height:200px;overflow:auto;border:1px solid #ccc;padding:10px;font-size:28px"></div>
  <input id="chatInput" placeholder="Mensaje..." disabled>
  <button id="enviarChatBtn" disabled>Enviar</button>
</div>

<script>
// ============================
// 🔥 FIREBASE
// ============================
firebase.initializeApp({
  apiKey: "AIzaSyBp2ZiKA4lYieyjX_aJJjE023NeqKrRhJc",
  authDomain: "seguridad-mdp-v2.firebaseapp.com",
  databaseURL: "https://seguridad-mdp-v2-default-rtdb.firebaseio.com",
  projectId: "seguridad-mdp-v2"
});

const auth = firebase.auth();
const db = firebase.database();

// ============================
// VARIABLES
// ============================
let idPatrulla = null;
let watchId = null;
let emergenciaActiva = false;
let localStream = null;
let pc = null;
let gpsActivo = false;
let map = null;
let marker = null;

// ============================
// 🎯 SELECCIONAR ELEMENTOS DEL DOM
// ============================
const gpsBtn = document.getElementById('gpsBtn');
const camaraBtn = document.getElementById('camaraBtn');
const detenerBtn = document.getElementById('detenerBtn');
const emergenciaBtn = document.getElementById('emergenciaBtn');
const chatBox = document.getElementById('chatBox');
const chatInput = document.getElementById('chatInput');
const enviarChatBtn = document.getElementById('enviarChatBtn');
const movilAsignado = document.getElementById('movilAsignado');
const localVideo = document.getElementById('localVideo');

console.log("🧩 [PATRULLA] DOM Elements loaded:", {
  gpsBtn: !!gpsBtn,
  camaraBtn: !!camaraBtn,
  detenerBtn: !!detenerBtn,
  emergenciaBtn: !!emergenciaBtn,
  chatBox: !!chatBox,
  chatInput: !!chatInput,
  enviarChatBtn: !!enviarChatBtn,
  localVideo: !!localVideo
});

// ============================
// HELPER: ESTADO
// ============================
function estado(mensaje) {
  const estadoDiv = document.getElementById('estado');
  if (estadoDiv) {
    estadoDiv.innerHTML = mensaje;
  }
}

// ============================
// SESIÓN
// ============================
auth.onAuthStateChanged(async user => {
  if (!user) return location.href = "/login.html";

  // 🚀 FAST TRACK: Deducir rol del email (sin depender de RTDB)
  const autoRol = user.email.includes("patrulla") ? "patrulla" : "com";
  
  if (autoRol !== "patrulla") {
    alert("Acceso no autorizado - Solo patrullas pueden acceder");
    return auth.signOut();
  }

  // 🔍 BUSCAR patrullaId en RTDB por email del usuario actual
  let patrullaIdBuscado = null;
  try {
    const usuariosSnap = await db.ref("usuarios").once("value");
    const usuarios = usuariosSnap.val() || {};
    
    // Buscar el usuario que coincida con el email actual
    for (const uid in usuarios) {
      if (usuarios[uid].email === user.email && usuarios[uid].patrullaId) {
        patrullaIdBuscado = usuarios[uid].patrullaId;
        console.log("✅ Patrulla encontrada en RTDB:", patrullaIdBuscado);
        break;
      }
    }
  } catch (err) {
    console.warn("⚠️ No se pudo buscar patrulla en RTDB:", err.message);
  }

  // 🆔 ID DE LA PATRULLA (del RTDB si existe, sino generar)
  idPatrulla = patrullaIdBuscado || "AA120JS"; // Fallback a AA120JS si no encuentra

  // Mostrar en UI
  movilAsignado.innerText = "Móvil: " + idPatrulla;

  // 🚓 REGISTRAR / CREAR PATRULLA AL INICIAR SESIÓN (CLAVE)
  await db.ref("patrullas/" + idPatrulla).update({
    online: true,
    estado: "conectado",
    camara: false,
    emergencia: false,
    hasNewMessage: false,
    timestamp: Date.now()
  }).catch(err => console.warn("⚠️ No se pudo registrar patrulla en RTDB:", err.message));

  console.log("🚓 Patrulla registrada en Firebase:", idPatrulla);

  // 🧹 Limpiar WebRTC si se corta conexión
  db.ref(`webrtc/${idPatrulla}`).onDisconnect().remove().catch(() => {});

  // 🔓 Habilitar controles
  gpsBtn.disabled = false;
  detenerBtn.disabled = false;
  emergenciaBtn.disabled = false;
  enviarChatBtn.disabled = false;
  chatInput.disabled = false;

  // 💬 Chat
  iniciarChat();

  // Estado UI
  estado("✅ Sesión iniciada. Activá el GPS.");
});

// ============================
// MAPA
// ============================
function iniciarMapa(lat, lng) {
  if (!map) {
    // Crear mapa sin controles de zoom (zoomControl: false)
    map = L.map("map", { zoomControl: false }).setView([lat, lng], 16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
    marker = L.marker([lat, lng]).addTo(map);
    
    // Crear contenedor de controles de zoom personalizados
    const mapContainer = document.getElementById("map");
    const zoomControls = document.createElement("div");
    zoomControls.id = "zoom-controls";
    zoomControls.innerHTML = `
      <button class="zoom-btn" id="zoom-in-btn" type="button">+</button>
      <button class="zoom-btn" id="zoom-out-btn" type="button">−</button>
    `;
    mapContainer.appendChild(zoomControls);
    
    // Eventos de zoom
    document.getElementById("zoom-in-btn").onclick = () => map.zoomIn();
    document.getElementById("zoom-out-btn").onclick = () => map.zoomOut();
  } else {
    marker.setLatLng([lat, lng]);
    map.setView([lat, lng]);
  }
}

// ============================
// GPS
// ============================
gpsBtn.onclick = () => {
  if (gpsActivo) {
    navigator.geolocation.clearWatch(watchId);
    gpsActivo = false;
    gpsBtn.innerText = "📡 Activar GPS";
    camaraBtn.disabled = true;
    estado("⏸️ GPS detenido");
    return;
  }

  watchId = navigator.geolocation.watchPosition(
    pos => {
      const { latitude, longitude } = pos.coords;

      iniciarMapa(latitude, longitude);

      db.ref("patrullas/" + idPatrulla).update({
        online: true,
        lat: latitude,
        lng: longitude,
        estado: emergenciaActiva ? "emergencia" : "activo",
        emergencia: emergenciaActiva,
        timestamp: Date.now()
      });
    },
    e => alert("Error GPS: " + e.message),
    { enableHighAccuracy: true }
  );

  gpsActivo = true;
  gpsBtn.innerText = "📡 GPS activo";
  camaraBtn.disabled = false;
  estado("📡 GPS transmitiendo");
};

// ============================
// CÁMARA + WEBRTC
// ============================
camaraBtn.onclick = async () => {
  try {
    console.log("[Cámara] 🎯 Iniciando solicitud de cámara...");
    
    // Constraints optimizados para transmisión WebRTC
    let constraints = {
      video: { 
        width: { min: 640, ideal: 1280, max: 1920 }, 
        height: { min: 480, ideal: 720, max: 1080 },
        frameRate: { ideal: 30, max: 60 },
        facingMode: "user"
      },
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    };
    
    try {
      localStream = await navigator.mediaDevices.getUserMedia(constraints);
      console.log("[Cámara] ✅ Stream con constraints óptimos obtenido");
    } catch (e) {
      console.warn("[Cámara] ⚠️ Constraints específicos fallaron, intentando versión simplificada...");
      // Si falla, intenta con menos restricciones
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });
        console.log("[Cámara] ✅ Stream básico obtenido");
      } catch (e2) {
        console.error("[Cámara] ❌ getUserMedia completamente falló:", e.message, e2.message);
        alert("❌ No se puede acceder a la cámara.\n\nPrueba:\n1. Usa el botón 'TEST VIDEO' para probar\n2. Permite acceso a cámara en configuración del navegador\n3. Recarga la página\n\nError: " + e2.message);
        return;
      }
    }

    console.log("[Cámara] ✅ Stream obtenido:", localStream);
    console.log("[Cámara] VideoTracks:", localStream.getVideoTracks().length);
    console.log("[Cámara] AudioTracks:", localStream.getAudioTracks().length);

    localVideo.srcObject = localStream;
    console.log("[Cámara] 📹 Video element srcObject asignado");

    await localVideo.play();
    console.log("[Cámara] ✅ Video reproduciendo localmente");
    
    // ⚠️ VALIDACIÓN CRÍTICA: Verificar que hay datos reales de video
    let hasRealVideoData = false;
    const validationTimeout = setTimeout(() => {
      if (!hasRealVideoData) {
        console.error("[Cámara] ❌ CRÍTICO: Video local no tiene datos después de 2s");
        console.log("[Cámara] videoWidth:", localVideo.videoWidth, "videoHeight:", localVideo.videoHeight);
        console.log("[Cámara] readyState:", localVideo.readyState);
        
        // Parar cámara
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        
        alert("⚠️ LA CÁMARA NO ESTÁ FUNCIONANDO O NO TIENE PERMISOS\n\nSwitchando a TEST VIDEO automáticamente...");
        
        // Iniciar TEST VIDEO automáticamente
        document.getElementById('testVideoBtn').click();
        return;
      }
    }, 2000);
    
    // Monitorear que realmente hay frames
    localVideo.onloadedmetadata = () => {
      if (localVideo.videoWidth > 0 && localVideo.videoHeight > 0) {
        hasRealVideoData = true;
        clearTimeout(validationTimeout);
        console.log(`[Cámara] ✅ VALIDADO: Video real ${localVideo.videoWidth}x${localVideo.videoHeight}`);
      }
    };
    
    localVideo.onplaying = () => {
      if (localVideo.videoWidth > 0) {
        hasRealVideoData = true;
        console.log("[Cámara] ✅ Video playing con datos reales");
      }
    };

    // Mostrar contenedor de cámara
    document.getElementById('cameraViewerContainer').style.display = 'block';
    console.log("[Cámara] 👁️ Contenedor visible");

    // Monitorear frames cada 200ms
    const monitorId = setInterval(() => {
      const videoTracks = localStream.getVideoTracks();
      if (videoTracks.length > 0) {
        const settings = videoTracks[0].getSettings();
        console.log(`[Cámara Monitor] width: ${settings.width}, height: ${settings.height}, frameRate: ${settings.frameRate}`);
      }
    }, 200);
    
    setTimeout(() => clearInterval(monitorId), 3000); // Monitor para 3 segundos

    await iniciarWebRTC();
    estado("🎥 Cámara activa");

  } catch (e) {
    console.error("[Cámara] ❌ Error:", e.message, e.name);
    console.error("[Cámara] ❌ Stack:", e.stack);
    
    // Intenta diagnosticar el problema
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cameras = devices.filter(d => d.kind === 'videoinput');
      console.log("[Cámara] Dispositivos disponibles:", devices.length, "Cámaras:", cameras.length);
      cameras.forEach((cam, idx) => {
        console.log(`  [${idx}] ${cam.label || 'Cámara desconocida'}`);
      });
    } catch (err) {
      console.error("[Cámara] No se pueden enumerar dispositivos");
    }
    
    alert("Error cámara: " + e.message + "\n\nIntenta:\n1. Permitir acceso en Configuración de Windows\n2. Asegúrate de que tiene cámara conectada\n3. Recarga la página");
  }
};

async function iniciarWebRTC() {
  // Limpiar datos de señalización anteriores para una conexión fresca
  console.log("🧹 [WebRTC] Limpiando referencia previa de:", idPatrulla);
  await db.ref(`webrtc/${idPatrulla}`).remove();

  console.log("🎬 [WebRTC] Iniciando WebRTC desde patrulla. idPatrulla:", idPatrulla);
  console.log("🎬 [WebRTC] localStream:", localStream, "Tracks:", localStream?.getTracks()?.length);

  // ============================
  // CÁMARA + WEBRTC (PATRULLA)
  // ============================

  pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  });

  // 1️⃣ AGREGAR PISTAS (CREA TRANSCEIVERS)
  if (!localStream) {
    console.error("❌ [WebRTC] localStream es null. No se pueden agregar tracks");
    alert("Error: No hay stream de cámara disponible");
    return;
  }

  const videoTracks = localStream.getVideoTracks();
  const audioTracks = localStream.getAudioTracks();

  console.log("🎬 [WebRTC] VideoTracks:", videoTracks.length, "AudioTracks:", audioTracks.length);

  let tracksAdded = 0;
  videoTracks.forEach(track => {
    console.log("🎬 [WebRTC] Video track - ID:", track.id, "Enabled:", track.enabled, "ReadyState:", track.readyState);
    if (track.readyState === 'live') {
      pc.addTrack(track, localStream);
      tracksAdded++;
      console.log("✅ Pista de video añadida a RTCPeerConnection");
    } else {
      console.warn("⚠️ Video track no está 'live' - ReadyState:" + track.readyState);
    }
  });

  audioTracks.forEach(track => {
    console.log("🎬 [WebRTC] Audio track - ID:", track.id, "Enabled:", track.enabled, "ReadyState:", track.readyState);
    if (track.readyState === 'live') {
      pc.addTrack(track, localStream);
      tracksAdded++;
      console.log("✅ Pista de audio añadida a RTCPeerConnection");
    } else {
      console.warn("⚠️ Audio track no está 'live'");
    }
  });

  if (tracksAdded === 0) {
    console.error("❌ [WebRTC] NO SE AGREGARON TRACKS - El stream no tiene contenido útil");
    alert("Error: El stream de cámara no tiene pistas de video o audio");
    return;
  }

  console.log("🎬 [WebRTC] Total tracks agregados:", tracksAdded);
  console.log("🎬 [WebRTC] Total transceivers:", pc.getTransceivers().length);
  
  // 🔍 DIAGNÓSTICO: Mostrar estado del video track siendo enviado
  const videoSender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
  if (videoSender) {
    console.log("[SENDER] 📊 Video sender track:", {
      id: videoSender.track.id,
      enabled: videoSender.track.enabled,
      readyState: videoSender.track.readyState,
      label: videoSender.track.label
    });
  }

  // 3️⃣ ICE CANDIDATES
  pc.onicecandidate = e => {
    if (e.candidate) {
      console.log("🧊 [WebRTC] ICE candidate generado:", e.candidate.candidate);
      db.ref(`webrtc/${idPatrulla}/ice_patru`).push(e.candidate);
    } else {
      console.log("🧊 [WebRTC] icecandidate complete (null)");
    }
  };

  pc.onconnectionstatechange = () => {
    console.log("🔌 [WebRTC] Connection state:", pc.connectionState);
    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      console.error("❌ [WebRTC] Conexión fallida - reintentar en 5 segundos");
      setTimeout(() => {
        if (pc && (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')) {
          console.log("🔄 [WebRTC] Reiniciando conexión...");
          iniciarWebRTC();
        }
      }, 5000);
    }
  };

  pc.oniceconnectionstatechange = () => {
    console.log("🧊 [WebRTC] ICE Connection state:", pc.iceConnectionState);
  };

  pc.onsignalingstatechange = () => {
    console.log("🎯 [WebRTC] Signaling state:", pc.signalingState);
  };

  // 4️⃣ CREAR Y ENVIAR OFFER
  console.log("📤 [WebRTC] Creando offer...");
  try {
    const offer = await pc.createOffer();
    console.log("📤 [WebRTC] Offer creado - Enviando a Firebase");
    await pc.setLocalDescription(offer);
    console.log("📤 [WebRTC] Local description set. Guardando offer en Firebase");
    await db.ref(`webrtc/${idPatrulla}/offer`).set(offer);
    console.log("✅ [WebRTC] Offer enviado a Firebase con éxito");
  } catch (err) {
    console.error("❌ [WebRTC] Error creando/enviando offer:", err.message);
    alert("Error en WebRTC: " + err.message);
    return;
  }

  // 5️⃣ RECIBIR ANSWER
  db.ref(`webrtc/${idPatrulla}/answer`).on("value", async s => {
    if (s.val()) {
      console.log("📥 [WebRTC] Answer recibido de COM");
      console.log("📥 [WebRTC] PC signalingState:", pc.signalingState);
      if (pc.signalingState === 'have-local-offer') {
        try {
          console.log("📥 [WebRTC] Configurando remote description con answer");
          await pc.setRemoteDescription(new RTCSessionDescription(s.val()));
          console.log("✅ [WebRTC] Remote description set correctamente");
        } catch (err) {
          console.error("❌ [WebRTC] Error seteando remote description:", err.message);
        }
      } else {
        console.log("📥 [WebRTC] Ignorando answer - signalingState no es 'have-local-offer'");
      }
    }
  });

  // 6️⃣ ICE DESDE COM
  db.ref(`webrtc/${idPatrulla}/ice_com`)
    .on("child_added", async s => {
      const candidate = s.val();
      console.log("🧊 [WebRTC] ICE candidate recibido de COM");
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
        console.log("✅ [WebRTC] ICE candidate agregado");
      } catch (err) {
        console.error("❌ [WebRTC] Error agregando ICE candidate:", err.message);
      }
    });
}



// ============================
// CHAT
// ============================
function iniciarChat() {
  db.ref("chat/" + idPatrulla).on("child_added", s => {
    const m = s.val();
    chatBox.innerHTML += `<div><b>${m.from}:</b> ${m.text}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

enviarChatBtn.onclick = () => {
  if (!chatInput.value) return;
  db.ref("chat/" + idPatrulla).push({
    from: idPatrulla,
    text: chatInput.value,
    timestamp: Date.now()
  });
  chatInput.value = "";
};

// ============================
// EMERGENCIA / DETENER
// ============================
emergenciaBtn.onclick = () => {
  emergenciaActiva = !emergenciaActiva;
  emergenciaBtn.classList.toggle("emergency", emergenciaActiva);
  
  db.ref("patrullas/" + idPatrulla).update({
    emergencia: emergenciaActiva,
    estado: emergenciaActiva ? "emergencia" : "activo",
    timestamp: Date.now()
  })
    .then(() => {
      console.log("🚨 [EMERGENCIA] Estado actualizado: emergencia=" + emergenciaActiva);
    })
    .catch(err => console.error("❌ [EMERGENCIA] Error:", err.message));
};

// ============================
// TEST VIDEO (PARA DEBUG - genera una onda con canvas)
// ============================
document.getElementById('testVideoBtn').onclick = async () => {
  try {
    console.log("[TEST] 🧪 Iniciando test video con canvas...");
    
    // ✅ MÉTODO MEJORADO: Usar MediaStream con canvas manualmente
    const canvas = document.createElement('canvas');
    canvas.width = 640;
    canvas.height = 480;
    const ctx = canvas.getContext('2d');
    
    // Crear stream de audio/video vacío que llenaremos con datos
    let frameCount = 0;
    let isDrawing = true;
    
    // Función para dibujar frame
    const drawFrame = () => {
      frameCount++;
      const hue = (frameCount % 360);
      
      // Fondo principal
      ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Rectángulo que cambia de color
      ctx.fillStyle = `hsl(${(hue + 120) % 360}, 100%, 50%)`;
      ctx.fillRect(80, 150, 200, 180);
      
      // Texto con contador
      ctx.fillStyle = 'white';
      ctx.font = 'bold 60px Arial';
      ctx.shadowColor = 'rgba(0, 0, 0, 1)';
      ctx.shadowBlur = 10;
      ctx.fillText(`${frameCount}`, 250, 300);
      
      // Pequeño cuadrado parpadeante
      if (frameCount % 10 < 5) {
        ctx.fillStyle = 'black';
      } else {
        ctx.fillStyle = 'white';
      }
      ctx.fillRect(550, 420, 40, 40);
    };
    
    // ✅ CRÍTICO: Dibujar primer frame ANTES de capturar
    console.log("[TEST] Dibujando primer frame antes de capturar...");
    drawFrame();
    
    // ✅ Usar canvas.captureStream() pero con frames garantizados
    console.log("[TEST] Capturando stream del canvas...");
    const canvasStream = canvas.captureStream(30);
    
    if (!canvasStream || canvasStream.getTracks().length === 0) {
      throw new Error("Canvas stream vacío");
    }
    
    console.log("[TEST] ✅ Canvas stream capturado con", canvasStream.getTracks().length, "tracks");
    
    // Asignar al video local
    localStream = canvasStream;
    localVideo.srcObject = localStream;
    
    try {
      await localVideo.play();
      console.log("[TEST] ✅ Video local reproduciendo");
    } catch (e) {
      console.warn("[TEST] ⚠️ Play autoplay rechazado:", e.message);
    }
    
    // ✅ ASEGURAR FRAMES CONTINUOS: Dibujar en canvas continuamente
    // Esto es crítico para que captureStream() tenga datos
    let animFrameCounter = 0;
    const animLoop = () => {
      if (!isDrawing) return;
      
      drawFrame();
      animFrameCounter++;
      
      // Log cada 100 frames
      if (animFrameCounter % 100 === 0) {
        console.log(`[TEST] 🎨 Canvas animación en marcha - ${animFrameCounter} frames dibujados`);
      }
      
      // Continuar más rápido que requestAnimationFrame para garantir 30fps
      setTimeout(animLoop, 33);
    };
    
    animLoop();
    
    // Guardar referencias para poder detener
    window.testIsRunning = () => isDrawing;
    window.testStop = () => { isDrawing = false; };
    
    console.log("[TEST] 🎬 Canvas animación iniciada");
    console.log("[TEST] 📊 Stream tracks:", canvasStream.getTracks().map(t => ({ kind: t.kind, enabled: t.enabled, readyState: t.readyState, id: t.id })));
    
    // Iniciar WebRTC con este stream
    console.log("[TEST] Iniciando WebRTC con canvas stream...");
    await iniciarWebRTC();
    estado("🧪 TEST VIDEO activo - colores animados transmitiendo");
    
  } catch (e) {
    console.error("[TEST] ❌ Error:", e.message);
    console.error("[TEST] Stack:", e.stack);
    alert("Error test video: " + e.message);
  }
};

console.log("🟢 [PATRULLA] Sistema inicializado ✅");

detenerBtn.onclick = () => {
  if (watchId) navigator.geolocation.clearWatch(watchId);
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) pc.close();
  
  // Limpiar test video si está activo
  if (window.testAnimId) {
    clearInterval(window.testAnimId);
    window.testAnimId = null;
  }

  // Ocultar contenedor de cámara
  document.getElementById('cameraViewerContainer').style.display = 'none';

  // Limpiar datos de WebRTC en Firebase al detener
  if (idPatrulla) {
    db.ref(`webrtc/${idPatrulla}`).remove();
  }

  estado("⛔ Sistema detenido");
};


function forzarH264(pc) {
  if (
    typeof RTCRtpSender === "undefined" ||
    !RTCRtpSender.getCapabilities
  ) {
    console.warn("⚠️ No se puede forzar H264 en este navegador");
    return;
  }

  const caps = RTCRtpSender.getCapabilities("video");
  const h264 = caps.codecs.filter(c =>
    c.mimeType.toLowerCase() === "video/h264"
  );

  if (!h264.length) {
    console.warn("⚠️ H264 no disponible");
    return;
  }

  pc.getTransceivers().forEach(t => {
    if (t.sender && t.sender.track && t.sender.track.kind === "video") {
      t.setCodecPreferences(h264);
      console.log("🎥 H264 forzado en patrulla");
    }
  });
}
