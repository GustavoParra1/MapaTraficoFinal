<!DOCTYPE html>
<html>
<head>
    <title>Test Geocoding</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input { padding: 10px; width: 300px; }
        button { padding: 10px 20px; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Test Geocoding API</h1>
    <input type="text" id="address" placeholder="Ingresa una dirección..." value="Buenos Aires y Juan B. Justo">
    <button onclick="testGeocode()">Buscar</button>
    
    <div id="result"></div>
    
    <script>
        async function testGeocode() {
            const address = document.getElementById('address').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = `<p>Buscando: "${address}"...</p>`;
            
            try {
                // Test server endpoint
                const response = await fetch(`http://localhost:3003/api/geocode?address=${encodeURIComponent(address)}`);
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <h3>✅ Encontrado</h3>
                        <p><strong>Dirección:</strong> ${data.address}</p>
                        <p><strong>Latitud:</strong> ${data.lat}</p>
                        <p><strong>Longitud:</strong> ${data.lng}</p>
                        <p><strong>Fuente:</strong> ${data.source}</p>
                        <p><a href="https://www.openstreetmap.org/?zoom=15&lat=${data.lat}&lon=${data.lng}&layers=M" target="_blank">Abrir en OpenStreetMap</a></p>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>❌ No encontrado</h3>
                        <p>${data.message}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `<h3>❌ Error</h3><p>${error.message}</p>`;
            }
        }
        
        // Test on load
        window.addEventListener('load', () => {
            testGeocode();
        });
    </script>
</body>
</html>
