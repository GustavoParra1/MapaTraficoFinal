<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071d4d">
    <title>Chat Operador - CIMU</title>
    <style>
        /* =====================================================
           CIMU - Chat de operadores (MAC, UPPL, Multiagencia,
           Encargado de Sala) con el estilo azul de la app.
           Misma paleta, tipografia y tamaños que los paneles.
           ===================================================== */
        :root {
            --cimu-azul-fondo: #0a2a66;
            --cimu-azul-banda: #071d4d;
            --cimu-azul-seccion: #16418f;
            --cimu-azul-cuerpo: #0d3377;
            --cimu-azul-boton: #1a4799;
            --cimu-azul-boton-hover: #2457b8;
            --cimu-azul-borde: #2c5bb3;
            --cimu-azul-linea: #1d4a9e;
            --cimu-texto: #d6e4fa;
            --cimu-texto-suave: #9fc2f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        @supports (height: 100dvh) {
            html, body { height: 100dvh; }
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            font-size: 14px;
            color: #1b2a41;
            background: var(--cimu-azul-banda);
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 640px;
            margin: 10px auto;
            background: #f4f8fe;
            border: 1px solid var(--cimu-azul-linea);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        /* ---------- Encabezado ---------- */
        .chat-header {
            background: var(--cimu-azul-banda);
            color: #fff;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header h2 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: .2px;
            margin: 0;
            line-height: 1.2;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid var(--cimu-azul-borde);
            color: var(--cimu-texto);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3ddc84;
            box-shadow: 0 0 0 2px rgba(61, 220, 132, .25);
        }

        /* ---------- Datos del operador ---------- */
        .operador-info {
            background: var(--cimu-azul-fondo);
            color: var(--cimu-texto);
            padding: 10px 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--cimu-azul-linea);
        }

        .operador-id {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 12px;
        }

        #operador-nombre {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        #operador-movil {
            font-size: 12px;
            font-weight: 600;
            color: var(--cimu-texto-suave);
        }

        .operador-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: stretch;
        }

        .operador-info input {
            flex: 1 1 180px;
            min-width: 0;
            height: 36px;
            padding: 6px 10px;
            font: inherit;
            font-size: 13px;
            color: #1b2a41;
            background: #fff;
            border: 1px solid #c9d6ea;
            border-radius: 6px;
        }

        .operador-info input::placeholder { color: #7b8aa3; }

        .operador-info input:focus {
            outline: 2px solid #5b8fe0;
            outline-offset: 0;
        }

        .logout-btn {
            height: 36px;
            padding: 0 12px;
            font: inherit;
            font-size: 12.5px;
            font-weight: 600;
            color: #e8f0fc;
            background: var(--cimu-azul-seccion);
            border: 1px solid var(--cimu-azul-borde);
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .logout-btn:hover { background: var(--cimu-azul-boton-hover); }

        .logout-btn.btn-limpiar {
            color: #ffd48a;
            background: transparent;
            border-color: #c98a1b;
        }

        .logout-btn.btn-limpiar:hover { background: rgba(201, 138, 27, .22); }

        /* ---------- Mensajes ---------- */
        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px 12px;
            background: #f4f8fe;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scrollbar-width: thin;
            scrollbar-color: #3d6cc4 transparent;
        }

        .message {
            max-width: 85%;
            padding: 6px 10px 5px;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.3;
            overflow-wrap: anywhere;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
        }

        /* Administrativo: a la izquierda, claro */
        .message.admin {
            align-self: flex-start;
            background: #fff;
            color: #1b2a41;
            border: 1px solid #c9d6ea;
            border-bottom-left-radius: 3px;
        }

        /* Operador (vos): a la derecha, azul */
        .message.operador {
            align-self: flex-end;
            background: var(--cimu-azul-boton);
            color: #fff;
            border-bottom-right-radius: 3px;
        }

        /* Avisos del sistema */
        .message.system {
            align-self: center;
            max-width: 100%;
            text-align: center;
            background: #fff7e0;
            border: 1px solid #f0d98c;
            color: #7a5b00;
            font-style: italic;
            font-size: 12.5px;
            box-shadow: none;
        }

        .message-sender {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .3px;
            opacity: .85;
            margin-bottom: 2px;
        }

        .message-time {
            font-size: 10px;
            opacity: .65;
            margin-top: 2px;
            text-align: right;
        }

        .message.system .message-time { text-align: center; }

        /* ---------- Barra para escribir ---------- */
        .input-area {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #fff;
            border-top: 1px solid #d5e0f1;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            height: 40px;
            padding: 8px 12px;
            font: inherit;
            font-size: 14px;
            color: #1b2a41;
            background: #fff;
            border: 1px solid #c9d6ea;
            border-radius: 6px;
        }

        .input-area input:focus {
            outline: 2px solid #5b8fe0;
            outline-offset: 0;
            border-color: #5b8fe0;
        }

        .input-area input:disabled { background: #eef2f9; }

        .button-group {
            display: flex;
            width: auto;
        }

        .send-btn {
            height: 40px;
            padding: 0 16px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: var(--cimu-azul-boton);
            border: 1px solid var(--cimu-azul-borde);
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .send-btn:hover:not(:disabled) { background: var(--cimu-azul-boton-hover); }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---------- Estados vacios / carga ---------- */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #5a6b86;
            font-size: 13px;
        }

        .empty-chat-icon {
            font-size: 2.6em;
            margin-bottom: 8px;
            opacity: 0.35;
        }

        .waiting-auth {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #5a6b86;
        }

        .spinner {
            border: 4px solid #dbe5f5;
            border-top: 4px solid var(--cimu-azul-boton-hover);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--cimu-azul-banda);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .splash-spinner {
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            animation: spin 1s linear infinite;
            margin-bottom: 14px;
        }

        .splash-text {
            color: var(--cimu-texto);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .2px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ---------- Celular ----------
           Pantalla completa, letra un poco mas grande y botones de
           44px para tocar con el dedo. Los campos de texto en 16px
           evitan que el navegador haga zoom al escribir. */
        @media (max-width: 600px) {
            body { font-size: 15px; }

            .chat-container {
                max-width: 100%;
                margin: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
                min-height: 0;
            }

            #operador-nombre { font-size: 17px; }
            #operador-movil { font-size: 13px; }

            .operador-info input,
            .input-area input { font-size: 16px; }

            .operador-info input,
            .logout-btn { height: 44px; }

            .logout-btn { flex: 1; font-size: 14px; }

            .message { font-size: 15px; padding: 8px 12px 6px; }
            .message.system { font-size: 14px; }
            .message-sender { font-size: 11.5px; }
            .message-time { font-size: 11px; }

            .input-area input,
            .send-btn { height: 46px; }

            .send-btn { font-size: 15px; padding: 0 18px; }
        }
    </style>
</head>
<body>
    <!-- Splash screen de carga -->
    <div class="splash-screen" id="splash-screen">
        <div class="splash-spinner"></div>
        <div class="splash-text">Cargando panel de chat...</div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h2>💬 Panel de Chat</h2>
            <div class="status-badge online" id="status-badge">Online</div>
        </div>

        <div class="operador-info">
            <div class="operador-id">
                <strong id="operador-nombre">Patrulla</strong>
                <span id="operador-movil">Movil AA120JS</span>
            </div>
            <div class="operador-controls">
                <input type="text" id="operador-nombre-input" placeholder="Tu nombre..." maxlength="30">
                <button class="logout-btn" id="logout-operador-btn">🚪 Salir</button>
                <button class="logout-btn btn-limpiar" id="reset-chat-btn">🗑️ Limpiar</button>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="empty-chat">
                <div class="empty-chat-icon">💬</div>
                <p>No hay mensajes aún</p>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="mensaje-input" placeholder="Escribe un mensaje..." disabled>
            <div class="button-group">
                <button class="send-btn" id="send-btn" disabled>📤 Enviar</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK v8 (Compat - API Global) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // Firebase ya está cargado por firebase-config.js
        const auth = firebase.auth();
        const db = firebase.firestore();
        const rtdb = firebase.database();
        
        let currentUser = null;
        let userRole = null;
        let messageListener = null;

        // Obtener rol de parámetros URL
        const urlParams = new URLSearchParams(window.location.search);
            let urlRole = urlParams.get('role');
            
            // Normalizar si es necesario (por si hay caché del navegador)
            if (urlRole === 'encargado') {
                urlRole = 'encargado-sala';
            }
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                // Ocultar splash screen antes de redirigir a login
                const splashScreen = document.getElementById('splash-screen');
                if (splashScreen) {
                    splashScreen.style.display = 'none';
                }
                window.location.href = 'login.html';
                return;
            }

            currentUser = user;
            
            // Usar rol de URL si está disponible, si no, extraer del email
            const roles = {
                'mac': 'MAC',
                'uppl': 'UPPL',
                'multiagencia': 'Multiagencia',
                'encargado-sala': 'Encargado de Sala'
            };

            userRole = urlRole || user.email.split('@')[0];
            console.log(`🔑 URL Role: ${urlRole}, Final userRole: ${userRole}`);
            
            const userDisplayName = roles[userRole] || 'Operador';

            // Mostrar nombre del operador (rol)
            document.getElementById('operador-nombre').textContent = `👤 ${userDisplayName}`;

            // Habilitar inputs directo (la autenticación en Firebase es suficiente)
            document.getElementById('mensaje-input').disabled = false;
            document.getElementById('send-btn').disabled = false;

            // Setup logout
            document.getElementById('logout-operador-btn').onclick = () => {
                auth.signOut().then(() => {
                    window.location.href = 'login.html';
                });
            };

            // Setup reset chat
            document.getElementById('reset-chat-btn').onclick = async () => {
                if (confirm('¿Estás seguro de que quieres resetear la conversación?')) {
                    await limpiarChat(userRole);
                }
            };

            // Setup listener para guardar nombre cuando cambia
            const nombreInput = document.getElementById('operador-nombre-input');
            let saveTimeout;
            nombreInput.addEventListener('input', () => {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    const nombre = nombreInput.value.trim();
                    if (nombre) {
                        saveOperadorName(userRole, nombre);
                    }
                }, 1000);
            });

            // Setup chat listeners - usar rol como ID
            setupChatListener(userRole);
            setupSendButton(userRole);
            
            // Marcar todos los mensajes como leídos cuando abre el chat
            markAllMessagesAsRead(userRole);

            // Ocultar splash screen cuando todo está listo
            setTimeout(() => {
                const splashScreen = document.getElementById('splash-screen');
                if (splashScreen) {
                    splashScreen.style.opacity = '0';
                    splashScreen.style.transition = 'opacity 0.3s ease-out';
                    splashScreen.addEventListener('transitionend', () => {
                        splashScreen.style.display = 'none';
                    });
                }
            }, 500);
        });

        // ===== GUARDAR NOMBRE DEL OPERADOR =====
        async function saveOperadorName(operadorRole, nombre) {
            try {
                await db.collection('operador-perfiles').doc(operadorRole).set({
                    nombre: nombre,
                    email: currentUser.email,
                    role: operadorRole,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                console.log('✅ Nombre guardado:', nombre);
            } catch (error) {
                console.error('❌ Error guardando nombre:', error);
            }
        }

        // ===== MARCAR TODOS LOS MENSAJES COMO LEÍDOS =====
        async function markAllMessagesAsRead(operadorRole) {
            try {
                console.log(`🔍 Marcando mensajes como leídos para: ${operadorRole}`);
                const snapshot = await db.collection('chats-com')
                    .doc(operadorRole)
                    .collection('messages')
                    .where('isRead', '==', false)
                    .get();
                
                console.log(`📊 Encontrados ${snapshot.size} mensajes sin leer`);
                
                if (snapshot.empty) {
                    console.log('ℹ️ No hay mensajes sin leer');
                    return;
                }

                const batch = db.batch();
                snapshot.docs.forEach(doc => {
                    batch.update(doc.ref, { isRead: true });
                });
                
                await batch.commit();
                console.log(`✅ ${snapshot.docs.length} mensajes marcados como leídos`);
            } catch (error) {
                console.warn('⚠️ Error marcando mensajes como leídos:', error.message);
            }
        }

        // Configurar listener de mensajes
        function setupChatListener(operadorId) {
            const chatPath = `chats-com/${operadorId}`;
            const messagesDiv = document.getElementById('messages');
            console.log(`📡 Configurando listener RTDB para: ${chatPath}`);
            
            if (messageListener) {
                messageListener();
            }

            messageListener = rtdb.ref(chatPath).on('value', (snapshot) => {
                console.log(`🔄 Actualización RTDB recibida para ${chatPath}`);
                messagesDiv.innerHTML = '';
                
                if (!snapshot.exists() || !snapshot.val().messages) {
                    console.log(`⚠️ No hay mensajes en RTDB para ${chatPath}`);
                    messagesDiv.innerHTML = `
                        <div class="empty-chat">
                            <div class="empty-chat-icon">💬</div>
                            <p>No hay mensajes aún.</p>
                        </div>
                    `;
                    return;
                }

                const messages = snapshot.val().messages;
                const messagesArray = Object.values(messages).sort(
                    (a, b) => a.timestamp - b.timestamp
                );

                messagesArray.forEach(msg => {
                    const isFromAdmin = msg.sender === 'admin';
                    const isSystem = msg.sender === 'system';
                    const div = document.createElement('div');
                    div.className = `message ${isSystem ? 'system' : (isFromAdmin ? 'admin' : 'operador')}`;
                    
                    const date = new Date(msg.timestamp);
                    const time = date.toLocaleTimeString('es-AR', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });

                    if (isSystem) {
                        div.innerHTML = `
                            <div>${escapeHtml(msg.text)}</div>
                            <div class="message-time">${time}</div>
                        `;
                    } else {
                        div.innerHTML = `
                            <div class="message-sender">${isFromAdmin ? '👨‍💼 Administrativo' : '👤 Tú'}</div>
                            <div>${escapeHtml(msg.text)}</div>
                            <div class="message-time">${time}</div>
                        `;
                    }
                    
                    messagesDiv.appendChild(div);
                });

                // Scroll al final
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }

        // Setup botón enviar
        function setupSendButton(operadorId) {
            const input = document.getElementById('mensaje-input');
            const sendBtn = document.getElementById('send-btn');

            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !sendBtn.disabled) {
                    sendMessage(operadorId);
                }
            });

            sendBtn.addEventListener('click', () => sendMessage(operadorId));
        }

        // Enviar mensaje
        async function sendMessage(operadorId) {
            const input = document.getElementById('mensaje-input');
            const text = input.value.trim();

            if (!text) return;

            try {
                const chatPath = `chats-com/${operadorId}`;
                console.log(`📝 Enviando mensaje a: ${chatPath}`);
                
                const timestamp = new Date().getTime();
                const message = {
                    text,
                    sender: 'operador',
                    timestamp: timestamp,
                    email: currentUser.email,
                    operadorRole: operadorId
                };

                // Guardar en RTDB
                const ref = rtdb.ref(chatPath).child('messages').push();
                await ref.set(message);
                console.log(`✅ Guardado en RTDB: ${chatPath}`);

                // También guardar en Firestore para historial (con timestamp de servidor)
                try {
                    const messageData = {
                        text,
                        sender: 'operador',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        email: currentUser.email,
                        operadorRole: operadorId,
                        isRead: false
                    };
                    
                    await db.collection('chats-com').doc(operadorId).collection('messages').add(messageData);
                    console.log(`✅ Guardado en Firestore: chats-com/${operadorId}/messages`);
                } catch (e) {
                    console.error('❌ Error guardando en Firestore:', e);
                }

                input.value = '';
                input.focus();
            } catch (error) {
                console.error('Error enviando mensaje:', error);
                alert('Error: ' + error.message);
            }
        }

        // Utility: escapar HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Limpiar/resetear todo el chat
        async function limpiarChat(operadorId) {
            try {
                const chatPath = `chats-com/${operadorId}`;
                console.log('🗑️ Eliminando mensajes de:', chatPath);
                
                // Eliminar de RTDB
                await rtdb.ref(chatPath).child('messages').remove();

                // Actualizar metadata
                await rtdb.ref(chatPath).update({
                    lastClearedAt: new Date().getTime()
                });

                // Eliminar de Firestore
                try {
                    const snapshot = await db.collection('chats-com').doc(operadorId).collection('messages').get();
                    const batch = db.batch();
                    snapshot.docs.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                } catch (e) {
                    console.warn('⚠️ No se pudo limpiar Firestore:', e);
                }

                console.log('✅ Chat limpiado');
                alert('Chat reseteado correctamente');
                
                // Limpiar UI
                const messagesDiv = document.getElementById('messages');
                if (messagesDiv) {
                    messagesDiv.innerHTML = `
                        <div class="empty-chat">
                            <div class="empty-chat-icon">💬</div>
                            <p>No hay mensajes aún.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('❌ Error limpiando chat:', error);
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
