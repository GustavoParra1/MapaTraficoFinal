<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - CIMU Mar del Plata</title>
    <link rel="icon" type="image/svg+xml" href="img/cimu-logo.svg">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<main class="login-wrapper">
    <div class="login-container">

        <header class="brand">
            <img src="img/cimu-logo.svg" alt="CIMU" class="brand-logo">
            <div class="brand-text">
                <h1>CIMU</h1>
                <p class="brand-name">Centro de Inteligencia<br>y Monitoreo Urbano</p>
                <p class="brand-city">MAR DEL PLATA</p>
            </div>
        </header>

        <form id="login-form" autocomplete="on">
            <h2>Iniciar sesión</h2>

            <div class="input-group">
                <label for="email">Correo</label>
                <input type="email" id="email" autocomplete="username" placeholder="usuario@seguridad-mdp.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>

            <button type="submit">Ingresar</button>
            <p id="error-message" class="error-message" role="alert"></p>
        </form>

        <footer class="login-footer">
            Más información + Mejores decisiones = Una ciudad más segura
        </footer>
    </div>
</main>

<!-- 🔥 Firebase v8 COMPAT (NO v9) -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- 🔧 Config Firebase -->
<script src="firebase-config.js"></script>

<!-- 🔐 Login -->
<script src="login.js"></script>

</body>
</html>
